<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 25px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            margin-top: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            background: #ff4d6d;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            background: #ff2e55;
        }

        #message {
            display: none;
            margin-top: 25px;
            color: #ff4d6d;
            font-size: 22px;
            font-weight: bold;
            animation: muncul 1s ease;
        }

        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 25px;
            animation: jatuh 4s linear forwards;
        }

        @keyframes muncul {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes jatuh {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Hai, Sayang ❤️</h1>

        <p>
            Aku punya sesuatu untuk kamu...
        </p>

        <button onclick="kejutan()">
            Klik Aku ❤️
        </button>

        <div id="message">
            Kamu adalah orang yang sangat berarti buat aku. ❤️
            <br><br>
            Aku sayang kamu. 🥰
        </div>
    </div>

    <script>
        function kejutan() {
            document.getElementById("message").style.display = "block";

            // Membuat hati berjatuhan
            for (let i = 0; i < 30; i++) {
                buatHati();
            }
        }

        function buatHati() {
            const heart = document.createElement("div");

            heart.classList.add("heart");
            heart.innerHTML = "❤️";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (Math.random() * 2 + 3) + "s";

            heart.style.fontSize =
                (Math.random() * 20 + 15) + "px";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
    </script>

</body>
</html>
